[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "blockrandom"
version = "0.1.0"
description = "Seeded permuted-block randomization lists for small clinical trials -- reproducible, stratified, with a sealed list and an audit log."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "RakTikoo" },
]
keywords = ["clinical trial", "randomization", "permuted block", "stratified", "allocation concealment", "reproducible"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = []

[project.scripts]
blockrandom = "blockrandom.cli:main"

[project.urls]
Homepage = "https://github.com/RakTikoo/blockrandom"

[tool.setuptools]
packages = ["blockrandom"]
